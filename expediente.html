<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#005293">
  <title>Ficha Médica Oficial | ASADA Bijagua de Upala</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
  <link rel="manifest" href="manifest.json">
</head>
<body data-page="ficha">

  <main class="wrap">
    <div class="noprint" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:20px">
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn" id="btn-imprimir">🖨️ Imprimir / Guardar en PDF</button>
        <a class="btn sec" href="javascript:history.back()">← Regresar</a>
      </div>
      <span style="font-size:13px;color:var(--mute)">Para exportar a PDF, presione Imprimir y elija "Guardar como PDF".</span>
    </div>

    <!-- Contenedor donde se dibuja la ficha o la tarjeta de emergencia -->
    <div id="contenedor-ficha">
      <div class="card" style="text-align:center;padding:40px">
        <p style="font-size:16px;color:var(--mute)">Cargando información del expediente desde Firestore...</p>
      </div>
    </div>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
