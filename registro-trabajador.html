<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#005293">
  <title>Crear Cuenta de Colaborador | ASADA Bijagua de Upala</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
  <link rel="manifest" href="manifest.json">
</head>
<body data-page="registro">

  <main class="wrap narrow">
    <form id="form-registro" class="card accent c2">
      <h1>Crear Cuenta de Colaborador</h1>
      <p style="font-size:13.5px;color:var(--mute);margin-bottom:18px">
        Regístrese para gestionar su expediente médico ocupacional en la ASADA Bijagua de Upala.
      </p>

      <div id="alerta-registro" class="alert hidden" role="alert"></div>

      <div style="margin-bottom:14px">
        <label for="c">Cédula de Identidad (sin guiones ni espacios) *</label>
        <input id="c" name="cedula" inputmode="numeric" pattern="\d{9,12}" maxlength="12" placeholder="Número de cédula física o DIMEX" required>
        <small style="color:var(--mute);font-size:11.5px">Formato oficial costarricense (9 a 12 dígitos numéricos).</small>
      </div>

      <div style="margin-bottom:14px">
        <label for="n">Nombre Completo *</label>
        <input id="n" name="nombre" placeholder="Nombre y apellidos" required>
      </div>

      <div style="margin-bottom:14px">
        <label for="pu">Puesto o Área de Trabajo *</label>
        <input id="pu" name="puesto" placeholder="Ej: Fontanero, Mantenimiento, Administración, Lecturista" required>
      </div>

      <div style="margin-bottom:14px">
        <label for="tel">Teléfono Principal *</label>
        <input id="tel" name="telefono" type="tel" inputmode="tel" placeholder="Ej: 88889999" required>
      </div>

      <div style="margin-bottom:14px">
        <label for="em">Correo Electrónico (Opcional)</label>
        <input id="em" name="email" type="email" placeholder="correo@ejemplo.com">
      </div>

      <div style="margin-bottom:14px">
        <label for="p">Contraseña (Mínimo 4 caracteres) *</label>
        <input id="p" name="clave" type="password" minlength="4" placeholder="••••••••" autocomplete="new-password" required>
      </div>

      <div style="margin-bottom:18px">
        <label for="p2">Confirmar Contraseña *</label>
        <input id="p2" name="clave2" type="password" minlength="4" placeholder="••••••••" autocomplete="new-password" required>
      </div>

      <div style="margin-bottom:20px;font-size:12.5px;line-height:1.5;background:var(--tint);padding:12px;border-radius:6px;border:1px solid var(--line)">
        <label style="display:flex;align-items:flex-start;gap:8px;font-weight:normal;color:var(--ink);cursor:pointer">
          <input type="checkbox" id="consentimiento" required style="width:auto;margin-top:3px">
          <span>
            <strong>Autorización y Consentimiento:</strong> Autorizo a la ASADA Bijagua de Upala a registrar y almacenar mis datos médicos y ocupacionales con fines de atención de emergencias, primeros auxilios y salud ocupacional, de conformidad con la Ley N° 8968.
          </span>
        </label>
      </div>

      <button id="btn-submit-registro" class="btn" style="width:100%;margin-bottom:12px">Crear Cuenta</button>
      
      <div style="text-align:center">
        <span style="font-size:13px;color:var(--mute)">¿Ya tiene cuenta registrada?</span><br>
        <a class="btn sec sm" href="login-trabajador.html" style="margin-top:8px">Ingresar a Mi Expediente</a>
      </div>
    </form>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
